<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, "Microsoft YaHei", sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f6f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #1f2937;
        }

        .panel {
            width: 100%;
            max-width: 380px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 28px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
        }

        h1 {
            margin: 0 0 20px;
            font-size: 24px;
        }

        label {
            display: block;
            margin-top: 14px;
            color: #4b5563;
            font-size: 14px;
        }

        input {
            width: 100%;
            height: 42px;
            margin-top: 6px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 0 12px;
            font-size: 15px;
        }

        button {
            width: 100%;
            height: 42px;
            margin-top: 20px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .switch {
            margin: 16px 0 0;
            text-align: center;
            color: #6b7280;
        }

        .switch a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="panel">
        <h1>登录</h1>
        <form action="/login" method="POST">
            <label>用户名
                <input name="username" autocomplete="username" required>
            </label>
            <label>密码
                <input name="password" type="password" autocomplete="current-password" required>
            </label>
            <button type="submit">登录</button>
        </form>
        <p class="switch"><a href="/register">没有账号？去注册</a></p>
    </main>
</body>

</html>
